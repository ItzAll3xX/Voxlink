[package]
name = "voxlink"
version = "1.0.0"
description = "VoxLink Desktop Client"
authors = ["VoxLink Team"]
license = "MIT"
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
] }
windows-capture = "2.0.1"
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
wasapi = "0.25.0"
webrtc = "0.21.1"
tokio = { version = "1", features = ["full"] }
